version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.13.0
        - nvm use 22.13.0
        - node --version
        - npm ci
    build:
      commands:
        - npm run web:build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
